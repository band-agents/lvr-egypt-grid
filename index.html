<title>la Vie en Rose Egypt Grid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#ffffff;--ink:#1d1416;--soft:#8a7578;--line:#ecdfdb;--scrim:rgba(16,8,10,.82);--panel:#ffffff;--ar:'Noto Kufi Arabic','Noto Sans Arabic','Geeza Pro',Tahoma,sans-serif;--body:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0809;--ink:#f3e8de;--soft:#b39d9b;--line:#33252a;--panel:#191113;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0809;--ink:#f3e8de;--soft:#b39d9b;--line:#33252a;--panel:#191113;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
main{max-width:720px;margin:0 auto;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:24px}
@media (min-width:760px){main{padding-block:48px}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;aspect-ratio:4/5;border:0;padding:0;margin:0;background:#000;cursor:pointer;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile svg{position:absolute;top:8px;right:8px;width:18px;height:18px;fill:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
.tile:focus-visible{outline:3px solid #aa0a27;outline-offset:-3px}
dialog{border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:12px;width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:hidden}
dialog::backdrop{background:var(--scrim)}
.vw{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);max-height:calc(100vh - 24px)}
@media (max-width:760px){.vw{grid-template-columns:minmax(0,1fr);overflow:auto}}
.pic{position:relative;background:#000}
.pic img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.nav,.x,.cp{border:0;cursor:pointer;display:grid;place-items:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);color:#1d1416}
.nav svg,.x svg,.cp svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav.p{left:10px}.nav.n{right:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.cap{padding:52px 22px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-width:0;font-size:14px;line-height:1.6}
.cap .en,.cap .ar{white-space:pre-line}
.cap .ar{font-family:var(--ar);direction:rtl;text-align:right;line-height:1.9}
.cap .tg{color:var(--soft);font-size:13px}
.x,.cp{position:absolute;top:10px;width:34px;height:34px;border-radius:50%;background:transparent;color:var(--ink)}
.x{right:10px}.cp{right:48px}
.x:hover,.cp:hover{background:var(--line)}
.cp.ok{color:#2e8b57}
.x:focus-visible,.cp:focus-visible,.nav:focus-visible{outline:2px solid #aa0a27;outline-offset:2px}
</style>
</head>

const $ = (i) => document.getElementById(i);
const icon = '<svg viewBox="0 0 24 24"><path d="M4 7h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm4-4h12a2 2 0 0 1 2 2v12h-2V5H8z"/></svg>';
$('g').innerHTML = P.map((p, i) => '<button class="tile" data-i="' + i + '" aria-label="Post ' + (P.length - i) + '"><img src="' + p.slides[0] + '" alt="">' + (p.slides.length > 1 ? icon : '') + '</button>').join('');
let c = null, k = 0;
function draw() {
  $('im').src = c.slides[k];
  const many = c.slides.length > 1; $('pv').hidden = $('nx').hidden = !many;
  $('dt').innerHTML = many ? c.slides.map((_, j) => '<i class="' + (j === k ? 'on' : '') + '"></i>').join('') : '';
}
$('g').addEventListener('click', (e) => { const t = e.target.closest('.tile'); if (!t) return; c = P[+t.dataset.i]; k = 0; $('en').textContent = c.en; $('ar').textContent = c.ar; $('tg').textContent = c.tags; draw(); $('d').showModal(); });
$('pv').onclick = () => { k = (k - 1 + c.slides.length) % c.slides.length; draw(); };
$('nx').onclick = () => { k = (k + 1) % c.slides.length; draw(); };
$('x').onclick = () => $('d').close();
$('d').addEventListener('click', (e) => { if (e.target === $('d')) $('d').close(); });
$('d').addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') $('nx').click(); if (e.key === 'ArrowLeft') $('pv').click(); });
let sx = null; $('im').addEventListener('touchstart', (e) => (sx = e.touches[0].clientX), { passive: true });
$('im').addEventListener('touchend', (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) (dx < 0 ? $('nx') : $('pv')).click(); sx = null; });
$('cp').onclick = () => {
  const done = () => { $('cp').classList.add('ok'); setTimeout(() => $('cp').classList.remove('ok'), 1200); };
  const fb = () => { const t = document.createElement('textarea'); t.value = c.caption; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) {} t.remove(); };
  try { navigator.clipboard.writeText(c.caption).then(done, fb); } catch (e) { fb(); }
};
